# Автоматические проверки. Запускаются сами при каждой отправке изменений
# и при каждом запросе на внесение изменений в основную ветку.
#
# Порядок шагов не случайный: сначала быстрые проверки, потом медленные.
# Нет смысла тратить две минуты на тесты, если код не проходит проверку
# стиля за десять секунд.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Если отправить новое изменение, пока старая проверка ещё идёт,
# старая останавливается: незачем занимать очередь устаревшим кодом.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Стиль кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить проверялку стиля
        run: pip install "ruff>=0.8"

      - name: Проверить правила
        run: ruff check .

      - name: Проверить оформление
        run: ruff format --check .

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости обоих сервисов
        run: |
          pip install --upgrade pip
          pip install -e "./services/accounts[dev]" -e "./services/orders[dev]"

      - name: Прогнать тесты
        run: pytest --cov-report=term-missing

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Собрать образ сервиса клиентов
        run: docker build -t accounts:ci ./services/accounts

      - name: Собрать образ сервиса заказов
        run: docker build -t orders:ci ./services/orders

      - name: Проверить образ заказов и кеш зависимостей
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-orders-image.sh

      - name: Показать размеры образов
        run: docker images --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | grep ':ci'

  secrets-scan:
    name: Поиск паролей
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить gitleaks и проверить контрольную сумму
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSL "$URL/$ARCHIVE" -o "$ARCHIVE"
          curl -fsSL "$URL/$CHECKSUMS" -o "$CHECKSUMS"
          grep " $ARCHIVE$" "$CHECKSUMS" | sha256sum --check --strict
          mkdir -p devops-gitleaks
          tar -xzf "$ARCHIVE" -C devops-gitleaks gitleaks
          echo "$RUNNER_TEMP/devops-gitleaks" >> "$GITHUB_PATH"

      - name: Проверить всю историю Git
        run: gitleaks git . --redact --no-banner

      - name: Проверить обнаружение учебного секрета
        run: python scripts/check_secret_scanner.py "$(command -v gitleaks)"

  publish:
    name: Публикация образа
    needs: [lint, tests, docker, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и отправить образ
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}/orders"

          docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE:$REVISION" \
            services/orders

          docker push "$IMAGE:$REVISION"
