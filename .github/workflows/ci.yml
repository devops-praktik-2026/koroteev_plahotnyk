# Автоматические проверки. Запускаются сами при каждой отправке изменений
# и при каждом запросе на внесение изменений в основную ветку.
#
# Порядок шагов не случайный: сначала быстрые проверки, потом медленные.
# Нет смысла тратить две минуты на тесты, если код не проходит проверку
# стиля за десять секунд.

name: Проверки

on:
  push:
    branches: [main, codex/devops-practicals]
  pull_request:

# Если отправить новое изменение, пока старая проверка ещё идёт,
# старая останавливается: незачем занимать очередь устаревшим кодом.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Стиль кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить проверялку стиля
        run: pip install "ruff>=0.8"

      - name: Проверить правила
        run: ruff check .

      - name: Проверить оформление
        run: ruff format --check .

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости обоих сервисов
        run: |
          pip install --upgrade pip
          pip install -e "./services/accounts[dev]" -e "./services/orders[dev]"

      - name: Прогнать тесты
        run: pytest --cov-report=term-missing

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ сервиса клиентов
        run: docker build -t accounts:ci ./services/accounts

      - name: Собрать образ сервиса заказов
        run: docker build -t orders:ci ./services/orders

      - name: Показать размеры образов
        run: docker images --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | grep ':ci'

      - name: Поднять систему и дождаться готовности
        run: docker compose up --build --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить создание заказа через два сервиса
        run: python scripts/smoke.py

      - name: Проверить ответ при отключённом сервисе клиентов
        run: |
          docker compose stop accounts
          python scripts/smoke.py --unavailable

      - name: Журналы при ошибке
        if: failure()
        run: docker compose logs --no-color

      - name: Удалить тестовую систему
        if: always()
        run: docker compose down -v

  integration:
    name: Проверка связки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -e "./services/accounts[dev]" -e "./services/orders[dev]"
      - name: Проверить реальные HTTP-запросы и отказ соседа
        run: python -m pytest integration --no-cov -s

  secrets-scan:
    name: Поиск паролей
    runs-on: ubuntu-latest
    env:
      VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Установить gitleaks
        run: |
          URL=https://github.com/gitleaks/gitleaks/releases/download
          curl -fsSL "$URL/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz gitleaks
      - name: Проверить всю историю
        run: ./gitleaks git . --redact

  publish:
    name: Публикация образа
    needs: [lint, tests, docker, integration, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Собрать и отправить образ
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}/orders"
          docker build --label "org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE:$REVISION" services/orders
          docker push "$IMAGE:$REVISION"
